services:
  postgres:
    image: postgres:latest
    container_name: rayaan_postgres
    environment:
      POSTGRES_USER: rayaan
      POSTGRES_PASSWORD: rayaan123
      POSTGRES_DB: rayaan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: rayaan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
