services:
  postgres:
    image: postgres:alpine
    profiles: [ "local-db" ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002

      FRONTEND_URL: ${FRONTEND_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_TEMP_SECRET: ${JWT_TEMP_SECRET}

      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX}

      DIGIPAY_SANDBOX: ${DIGIPAY_SANDBOX}
      DIGIPAY_CLIENT_ID: ${DIGIPAY_CLIENT_ID}
      DIGIPAY_CLIENT_SECRET: ${DIGIPAY_CLIENT_SECRET}
      DIGIPAY_USERNAME: ${DIGIPAY_USERNAME}
      DIGIPAY_PASSWORD: ${DIGIPAY_PASSWORD}
      DIGIPAY_MOCK_MODE: ${DIGIPAY_MOCK_MODE}
      DIGIPAY_SELLER_ID: ${DIGIPAY_SELLER_ID}
      DIGIPAY_SUPPLIER_ID: ${DIGIPAY_SUPPLIER_ID}

      SSL_KEY_PATH: ${SSL_KEY_PATH}
      SSL_CERT_PATH: ${SSL_CERT_PATH}

      SMS_PROVIDER: ${SMS_PROVIDER}
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME}
      MELIPAYAMAK_PASSWORD: ${MELIPAYAMAK_PASSWORD}
      MELIPAYAMAK_FROM: ${MELIPAYAMAK_FROM}
      MELIPAYAMAK_OTP_BODY_ID: ${MELIPAYAMAK_BODY_ID}
      MELIPAYAMAK_PATTERN_API_URL: ${MELIPAYAMAK_PATTERN_API_URL}
      SMSIR_API_KEY: ${SMSIR_API_KEY}
      SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID}
      SMSIR_OTP_PARAMETER_NAME: ${SMSIR_OTP_PARAMETER_NAME}

      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      LIARA_ENDPOINT: ${LIARA_ENDPOINT}
      LIARA_ACCESS_KEY: ${LIARA_ACCESS_KEY}
      LIARA_SECRET_KEY: ${LIARA_SECRET_KEY}
      LIARA_BUCKET_NAME: ${LIARA_BUCKET_NAME}
      STORAGE_REGION: ${STORAGE_REGION}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        INTERNAL_API_URL: ${INTERNAL_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
    depends_on:
      backend:
        condition: service_started

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
